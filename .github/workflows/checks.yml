name: Public code and synthetic tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate publication and history
        run: python scripts/check_publication.py --history
      - name: Install public dependencies
        run: |
          python -m pip install -r requirements.txt
          brew list tesseract >/dev/null 2>&1 || brew install tesseract
      - name: Synthetic tests only
        run: python -m pytest -q
